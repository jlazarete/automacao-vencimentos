name: Validação de Código (CI)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Princípio do menor privilégio: este workflow não usa nenhum segredo e só lê o código.
permissions:
  contents: read

concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # Actions de terceiros fixadas por SHA do commit (ver comentário em automacao.yml).
    - name: Baixando código do repositório
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Configurando Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.12'

    - name: Instala dependências do projeto
      run: pip install -r requirements.txt

    - name: Executa Agente de Validação
      run: python validar_codigo.py

    - name: Testes de privacidade e segurança
      run: |
        python teste_lgpd.py
        python teste_seguranca.py

    - name: Análise Estática de Segurança (Bandit)
      run: |
        pip install bandit==1.9.4
        bandit -r main.py lgpd_engine.py atualizar_datas_dropbox.py

    - name: Auditoria de vulnerabilidades nas dependências (pip-audit)
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt
